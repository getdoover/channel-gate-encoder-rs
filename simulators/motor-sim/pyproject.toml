[project]
name = "motor-sim"
version = "0.1.0"
description = "Control UI for the platform-iface sim: drive a quadrature pulse train and watch the encoder's tags change on the dda"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydoover>=1.11.5",
    "grpcio>=1.65",
    "grpcio-health-checking>=1.65",
]
