[package]
name = "channel-gate-encoder"
version = "0.1.0"
edition = "2021"
description = "Rising-edge quadrature encoder for a channel gate, on doover-rs"
license = "MIT"
publish = false

[[bin]]
name = "channel-gate-encoder"
path = "src/main.rs"

[lib]
name = "channel_gate_encoder"
path = "src/lib.rs"

[dependencies]
# doover-rs is not published to crates.io, so this is a git dependency pinned
# to the latest RELEASE tag.
doover = { git = "https://github.com/getdoover/doover-rs.git", tag = "0.1.3" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# StreamExt::next, for consuming the raw startPulseCounter stream ourselves.
tokio-stream = "0.1"

[dev-dependencies]
# The gRPC test double for the platform interface + the fake device agent both
# implement the generated *server* stubs, which doover-rs re-exports.
doover-proto = { git = "https://github.com/getdoover/doover-rs.git", tag = "0.1.3" }
tonic = "0.13"
prost = "0.13"
tokio-stream = { version = "0.1", features = ["net"] }

[profile.release]
# Match doover-rs: one codegen unit + LTO, for the smallest static binary.
lto = true
codegen-units = 1
strip = true
